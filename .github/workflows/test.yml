name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_123456
          MONGO_URI: mongodb://127.0.0.1:27017/skilltracker_test
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'mock_openrouter_key' }}
          SKIP_RATE_LIMIT: true